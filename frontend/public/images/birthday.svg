<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bdayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="100%" stop-color="#537895"/>
    </linearGradient>
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff9933"/>
    </linearGradient>
    <filter id="bdayGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" rx="28" fill="url(#bdayGrad)"/>
  
  <!-- Festive Balloons & Confetti -->
  <circle cx="160" cy="140" r="35" fill="#ff7a00" opacity="0.8"/>
  <path d="M160,175 Q150,210 170,240" stroke="#ff9933" fill="none" stroke-width="2"/>
  
  <circle cx="440" cy="130" r="40" fill="#00f2fe" opacity="0.7"/>
  <path d="M440,170 Q450,200 430,235" stroke="#00f2fe" fill="none" stroke-width="2"/>

  <!-- Birthday Cake -->
  <g transform="translate(300, 190)" filter="url(#bdayGlow)">
    <!-- Base tier -->
    <rect x="-60" y="0" width="120" height="40" rx="6" fill="url(#cakeGrad)"/>
    <!-- Top tier -->
    <rect x="-45" y="-35" width="90" height="35" rx="6" fill="#ffd700"/>
    <!-- Candles -->
    <line x1="-20" y1="-35" x2="-20" y2="-50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-20" cy="-56" r="4" fill="#ff512f"/>
    <line x1="0" y1="-35" x2="0" y2="-55" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-61" r="5" fill="#ff512f"/>
    <line x1="20" y1="-35" x2="20" y2="-50" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="20" cy="-56" r="4" fill="#ff512f"/>
  </g>

  <!-- Typography -->
  <text x="50%" y="330" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">
    Birthday Planning
  </text>
  <text x="50%" y="360" fill="#ff9933" font-family="'Inter', sans-serif" font-size="16" font-weight="500" text-anchor="middle" opacity="0.9">
    Custom Themes • Entertainment • Cakes
  </text>
</svg>
