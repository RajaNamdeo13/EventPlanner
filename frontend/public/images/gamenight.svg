<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="28" fill="url(#gameGrad)"/>
  
  <!-- Game Controller & Neon Dice -->
  <g transform="translate(300, 160)">
    <!-- Controller Body -->
    <path d="M-80,-20 C-80,-50 80,-50 80,-20 C90,20 100,50 70,60 C50,65 40,40 20,40 L-20,40 C-40,40 -50,65 -70,60 C-100,50 -90,20 -80,-20 Z" fill="#1e1e38" stroke="#00f2fe" stroke-width="3"/>
    <!-- D-pad -->
    <rect x="-55" y="-15" width="26" height="8" rx="2" fill="#ff7a00"/>
    <rect x="-46" y="-24" width="8" height="26" rx="2" fill="#ff7a00"/>
    <!-- Action buttons -->
    <circle cx="45" cy="-7" r="5" fill="#ffd700"/>
    <circle cx="57" cy="5" r="5" fill="#ff512f"/>
    <circle cx="33" cy="5" r="5" fill="#00f2fe"/>
    <circle cx="45" cy="17" r="5" fill="#71b280"/>
  </g>

  <!-- Typography -->
  <text x="50%" y="330" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">
    Game Night & Tournaments
  </text>
  <text x="50%" y="360" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="16" font-weight="500" text-anchor="middle" opacity="0.9">
    Arcades • Board Games • Esports Tournaments
  </text>
</svg>
