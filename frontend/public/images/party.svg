<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="partyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a00e0"/>
      <stop offset="100%" stop-color="#8e2de2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="28" fill="url(#partyGrad)"/>
  
  <!-- Disco Ball & Light Rays -->
  <g transform="translate(300, 150)">
    <line x1="0" y1="-150" x2="0" y2="-50" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="50" fill="#333" stroke="#ffd700" stroke-width="3"/>
    <!-- Facets -->
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="50" ry="38" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-50" x2="0" y2="50" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <line x1="-35" y1="-35" x2="-35" y2="35" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
    <line x1="35" y1="-35" x2="35" y2="35" stroke="#fff" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Light beams -->
    <polygon points="0,0 -200,200 -120,200" fill="#ffd700" opacity="0.15"/>
    <polygon points="0,0 120,200 200,200" fill="#00f2fe" opacity="0.15"/>
  </g>

  <!-- Typography -->
  <text x="50%" y="330" fill="#ffffff" font-family="'Inter', sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">
    Party & Gala Planning
  </text>
  <text x="50%" y="360" fill="#00f2fe" font-family="'Inter', sans-serif" font-size="16" font-weight="500" text-anchor="middle" opacity="0.9">
    DJs • Staging • Lighting • VIP Lounges
  </text>
</svg>
